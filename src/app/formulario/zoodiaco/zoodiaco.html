<div class="min-h-screen bg-cover bg-center bg-no-repeat p-4 flex items-center justify-center"
    style="background-color: rgb(195, 0, 0);">
    <div class="p-6 max-w-4xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <div>
                <h2 class="text-xl font-bold mb-4">Datos personales</h2>

                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Nombre</label>
                    <input type="text" [(ngModel)]="nombre" class="w-full p-2 border rounded-lg bg-gray-50"
                        placeholder="Nombre">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Apellido Paterno</label>
                    <input type="text" [(ngModel)]="apaterno" class="w-full p-2 border rounded-lg bg-gray-50"
                        placeholder="Paterno">
                </div>

                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Apellido Materno</label>
                    <input type="text" [(ngModel)]="amaterno" class="w-full p-2 border rounded-lg bg-gray-50"
                        placeholder="Materno">
                </div>

                <h3 class="font-bold mt-4 mb-2">Fecha de nacimiento</h3>
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div>
                        <label class="block text-xs mb-1">Día</label>
                        <input type="number" [(ngModel)]="dia" class="w-full p-2 border rounded-lg bg-gray-50"
                            placeholder="27">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Mes</label>
                        <input type="number" [(ngModel)]="mes" class="w-full p-2 border rounded-lg bg-gray-50"
                            placeholder="01">
                    </div>
                    <div>
                        <label class="block text-xs mb-1">Año</label>
                        <input type="number" [(ngModel)]="anio" class="w-full p-2 border rounded-lg bg-gray-50"
                            placeholder="2004">
                    </div>
                </div>

                <h3 class="font-bold mb-2">Sexo</h3>
                <div class="space-y-1 mb-6">
                    <div>
                        <input type="radio" id="masculino" name="sexo" value="Masculino" [(ngModel)]="sexo">
                        <label for="masculino" class="ml-2 text-sm">Masculino</label>
                    </div>
                    <div>
                        <input type="radio" id="femenino" name="sexo" value="Femenino" [(ngModel)]="sexo">
                        <label for="femenino" class="ml-2 text-sm">Femenino</label>
                    </div>
                </div>

                <button (click)="imprimir()" type="button"
                    class="border-2 border-black font-bold px-6 py-2 rounded hover:bg-gray-100">
                    Imprimir
                </button>
            </div>

            @if (mostrarResultado) {
            <div class="flex flex-col items-center justify-center space-y-4 text-center border-l pl-6">
                <h2 class="text-2xl font-normal">
                    Hola <span class="font-bold italic">{{ nombreCompleto }}</span>
                </h2>

                <p class="text-xl">
                    Tienes <span class="font-bold">{{ edadCalculada }}</span> años
                </p>

                <p class="text-xl">tu signo zodiacal</p>

                <div class="flex items-center justify-center gap-3">
                    <span class="text-xl">Es <span class="font-normal">{{ nombreSigno }}</span></span>

                    <div class="w-80 h-80 flex items-center justify-center p-3">
                        <img [src]="imagenSignoUrl" alt="Signo">
                    </div>
                </div>
            </div>
            }

        </div>
    </div>
</div>
