<br><br><br><br>
<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">

    <h1 class="text-3xl font-bold text-gray-900 mb-6">
        Formulario de Registro
    </h1>

    <form [formGroup]="formulario" (ngSubmit)="muestraAlumno()">

        <!-- Matrícula -->
        <div class="mb-5">
            <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">
                Matrícula
            </label>
            <input type="text" id="matricula" formControlName="matricula"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Ingrese su matrícula">
        </div>

        <!-- Nombre -->
        <div class="mb-5">
            <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
                Nombre completo
            </label>
            <input type="text" id="nombre" formControlName="nombre"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Ingrese su nombre">
        </div>

        <!-- Correo -->
        <div class="mb-5">
            <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">
                Correo electrónico
            </label>
            <input type="email" id="correo" formControlName="correo"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="ejemplo@correo.com">
        </div>

        <!-- Materia -->
        <div class="mb-5">
            <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
                Materia
            </label>
            <input type="text" id="materia" formControlName="materia"
                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="Ingrese el nombre de la materia">
        </div>

        <!-- Botones -->
        <div class="flex justify-end gap-3 mt-6">
            <!-- Botón Cargar -->
            <button type="button"
                class="text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5">
                Cargar
            </button>

            <!-- Botón Registrar -->
            <button type="submit"
                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
                Registrar
            </button>
        </div>

    </form>

    <!-- Lista de Alumnos -->
    <div class="mt-8 border-t pt-6">
        <h2 class="mb-4 text-2xl font-bold text-gray-900">
            Lista de Alumnos
        </h2>
        <p class="text-gray-700"><strong>Matrícula:</strong> {{ nuevoAlumno.matricula }}</p>
        <p class="text-gray-700"><strong>Nombre:</strong> {{ nuevoAlumno.nombre }}</p>
        <p class="text-gray-700"><strong>Correo:</strong> {{ nuevoAlumno.correo }}</p>
        <p class="text-gray-700"><strong>Materia:</strong> {{ nuevoAlumno.materia }}</p>
    </div>

</div>
