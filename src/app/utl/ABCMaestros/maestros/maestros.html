<br><br>
<div class="p-4 sm:p-6">
    <div class="bg-white dark:bg-gray-800 shadow-md sm:rounded-lg overflow-hidden border border-gray-200 dark:border-gray-700">

        <!-- Header de la tarjeta -->
        <div class="flex flex-col md:flex-row items-center justify-between space-y-3 md:space-y-0 md:space-x-4 p-4 border-b dark:border-gray-700">
            <div class="w-full md:w-1/2">
                <h1 class="text-xl font-bold text-gray-900 dark:text-white">Lista de Maestros UTL</h1>
            </div>
            <div class="w-full md:w-auto flex flex-col md:flex-row space-y-2 md:space-y-0 items-stretch md:items-center justify-end md:space-x-3">
                <button type="button"
                    class="flex items-center justify-center text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2 dark:bg-blue-600 dark:hover:bg-blue-700">
                    Agregar Maestro
                </button>
            </div>
        </div>

        <!-- Barra de Filtro -->
        <div class="p-4 border-b dark:border-gray-700 bg-gray-50 dark:bg-gray-900">
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-center">
                <div class="md:col-span-2">
                    <label class="text-sm font-medium text-gray-900 dark:text-white">Filtrar por:</label>
                </div>
                <div class="md:col-span-4">
                    <input [(ngModel)]="listFilter" type="text" id="listFilter"
                        placeholder="Ingrese nombre del maestro..."
                        class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white">
                </div>
            </div>
            <div class="mt-3">
                <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Filtro activo: </span>
                <span class="text-sm text-blue-600 dark:text-blue-400 font-bold">{{ listFilter }}</span>
            </div>
        </div>

        <!-- Tabla de Datos -->
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left text-gray-500 dark:text-gray-400">
                <thead class="text-xs text-gray-700 uppercase bg-gray-100 dark:bg-gray-700 dark:text-gray-400">
                    <tr>
                        <th scope="col" class="px-4 py-3">ID Maestro</th>
                        <th scope="col" class="px-4 py-3">Nombre</th>
                        <th scope="col" class="px-4 py-3">A. Paterno</th>
                        <th scope="col" class="px-4 py-3">A. Materno</th>
                        <th scope="col" class="px-4 py-3">Correo</th>
                        <th scope="col" class="px-4 py-3 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let maestro of dataSource | maestroFilter : listFilter"
                        class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                        <td class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap dark:text-white">{{ maestro.idmaestro }}</td>
                        <td class="px-4 py-3">{{ maestro.nombre | uppercase }}</td>
                        <td class="px-4 py-3">{{ maestro.apaterno }}</td>
                        <td class="px-4 py-3">{{ maestro.amaterno }}</td>
                        <td class="px-4 py-3">{{ maestro.correo }}</td>
                        <td class="px-4 py-3 text-center space-x-2">
                            <button (click)="editarMaestro(maestro)"
                                class="px-3 py-1.5 text-xs font-medium text-white bg-green-600 rounded-lg hover:bg-green-700">
                                Editar
                            </button>
                            <button (click)="eliminarMaestro(maestro)"
                                class="px-3 py-1.5 text-xs font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Mensaje vacío -->
            <div *ngIf="!dataSource || dataSource.length === 0"
                class="p-6 text-center text-gray-500 dark:text-gray-400">
                No hay maestros disponibles en este momento.
            </div>
        </div>

    </div>
</div>
